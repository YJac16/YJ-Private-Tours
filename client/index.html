      html,

      #standalone-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4.5vw;
        background: #edeae2;
        padding: 8vh 8vw;
        box-sizing: border-box;
      }
      #standalone-splash[hidden] {
        display: none;
      }
      .standalone-splash-mark {
        width: min(68vw, 22rem);
        height: auto;
      }
      .standalone-splash-word {
        width: min(78vw, 26rem);
        height: auto;

    </div>
    <div id="root"></div>
    <script>
      (function () {
        var standalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true
        var splash = document.getElementById('standalone-splash')
        if (standalone && splash) splash.hidden = false
      })()
    </script>
